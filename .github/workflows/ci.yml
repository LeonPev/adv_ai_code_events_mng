name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to Firebase App Hosting after tests pass
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 20

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit critical production dependencies
        run: npm run security:audit

      - name: Report high severity production advisories
        run: npm run security:audit:strict
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

  unittests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ccms_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ccms_test?schema=public
      NEXTAUTH_SECRET: test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3001

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ccms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ccms_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply test database migrations
        run: npm run test:db:setup

      - name: Build
        run: npm run build

      - name: Run Vitest
        run: npm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ccms_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ccms_test?schema=public
      NEXTAUTH_SECRET: test-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3001

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ccms_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ccms_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/.test-results
            test-results
          if-no-files-found: ignore

  deploy:
    name: Deploy to Firebase App Hosting
    needs:
      - security
      - lint
      - unittests
      - e2e
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ccms--huji-leon.us-central1.hosted.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Authenticate to Google Cloud with service account key
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HUJI_LEON }}
          project_id: huji-leon

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy
        run: npm run deploy
